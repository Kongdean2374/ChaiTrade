name: Product experience development validation
on:
  push:
    branches: [product-experience-20261027]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash scripts/preflight.sh
      - name: Compile device and simulator without changing release acceptance
        run: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild build -project ChaiTrade.xcodeproj -scheme ChaiTrade -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' 2>&1 | tee build/logs/product-device-build.log
          simulator_id="$(python3 scripts/prepare_simulator.py)"
          xcodebuild build-for-testing -project ChaiTrade.xcodeproj -scheme ChaiTrade -destination "platform=iOS Simulator,id=$simulator_id,arch=$(uname -m)" -derivedDataPath build/UISimulator CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='' ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" 2>&1 | tee build/logs/product-ui-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-integration-diagnostics
          path: build/logs/
          retention-days: 7
  core:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash scripts/test.sh
      - run: bash scripts/test_stress.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-core-diagnostics
          path: build/logs/
          retention-days: 7

  interaction:
    needs: native
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: All original interaction and smoke cases twice plus focused order twice
        run: bash scripts/test_ui.sh
      - name: Preserve failure evidence and independent databases
        if: always()
        run: python3 scripts/collect_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-original-interaction-evidence
          path: |
            build/logs/
            build/UITests.xcresult
            build/UIOrderFocused.xcresult
          retention-days: 7
  product-ui:
    needs: native
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Independent clean product discovery and real flow tests
        run: bash scripts/test_product_ui.sh
      - name: Preserve failure evidence and independent databases
        if: always()
        run: python3 scripts/collect_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-journey-and-screenshot-evidence
          path: |
            build/logs/
            build/ProductUITests.xcresult
          retention-days: 7

name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify toolchain and bundled resources
        run: bash scripts/preflight.sh
      - name: Core, persistence, replay and backup tests
        run: bash scripts/test.sh
      - name: Required 100,000-fill Release performance and integrity gate
        run: bash scripts/test_stress.sh
      - name: Build and verify unsigned iPhoneOS IPA
        run: bash scripts/build_unsigned_ipa.sh
      - name: Isolated iPhone UI interaction and smoke tests
        run: bash scripts/test_ui.sh
        timeout-minutes: 35
      - name: Read-only public market connectivity evidence
        run: python3 scripts/probe_public_market.py
        timeout-minutes: 1
      - name: Finalize metadata after required UI tests
        run: |
          python3 scripts/build_info.py
          cp build/logs/ui-tests.log build/logs/stress-tests.log build/logs/stress-100000.json dist/
      - name: Upload IPA, checksum and build info
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChaiTrade-unsigned-ipa
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Collect app launch diagnostics
        if: always()
        run: python3 scripts/collect_diagnostics.py
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChaiTrade-test-evidence
          path: |
            build/logs/
            build/UITests.xcresult
          retention-days: 7
          if-no-files-found: warn

name: SQLite archive platform diagnostics
on:
  push:
    branches: [diagnose-sqlite-archive-20261027, validate-fugle-history-20261027]
permissions:
  contents: read
jobs:
  sqlite-platform:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Probe platform archive protections
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sqlite-archive-probe.c" <<'PROBE'
          #include <stdio.h>
          #include <sqlite3.h>
          int main(void) {
              sqlite3 *db = NULL;
              int rc = sqlite3_open_v2(":memory:", &db, SQLITE_OPEN_READWRITE | SQLITE_OPEN_CREATE, NULL);
              if (rc != SQLITE_OK) return 1;
              printf("sqlite_version=%s\n", sqlite3_libversion());
              printf("omit_load_extension=%d\n", sqlite3_compileoption_used("OMIT_LOAD_EXTENSION"));
              int flag = -1;
              rc = sqlite3_db_config(db, SQLITE_DBCONFIG_DEFENSIVE, 1, &flag);
              printf("defensive_enable_rc=%d flag=%d\n", rc, flag);
              flag = -1;
              rc = sqlite3_db_config(db, SQLITE_DBCONFIG_DEFENSIVE, -1, &flag);
              printf("defensive_read_rc=%d flag=%d\n", rc, flag);
              flag = -1;
              rc = sqlite3_db_config(db, SQLITE_DBCONFIG_ENABLE_LOAD_EXTENSION, 0, &flag);
              printf("extension_disable_rc=%d flag=%d\n", rc, flag);
              flag = -1;
              rc = sqlite3_db_config(db, SQLITE_DBCONFIG_ENABLE_LOAD_EXTENSION, -1, &flag);
              printf("extension_read_rc=%d flag=%d\n", rc, flag);
              sqlite3_close(db);
              return 0;
          }
          PROBE
          xcrun clang -Wall -Wextra -Werror "$RUNNER_TEMP/sqlite-archive-probe.c" -lsqlite3 -o "$RUNNER_TEMP/sqlite-archive-probe"
          "$RUNNER_TEMP/sqlite-archive-probe"
  archive-core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Complete core and actual public source checks
        run: bash scripts/test.sh
      - name: Original T45 gate
        run: bash scripts/test_stress.sh
      - name: Preserve exact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-archive-core-${{ github.sha }}
          path: build/logs
          if-no-files-found: error
  native-chart-integration:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: bash scripts/preflight.sh
      - name: Compile both real iOS and XCTest targets
        run: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild build -project ChaiTrade.xcodeproj -scheme ChaiTrade -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' 2>&1 | tee build/logs/history-device-build.log
          simulator_id="$(CHAI_PREPARE_BUILD_ONLY=1 python3 scripts/prepare_simulator.py)"
          xcodebuild build-for-testing -project ChaiTrade.xcodeproj -scheme ChaiTrade -destination "platform=iOS Simulator,id=$simulator_id,arch=$(uname -m)" -derivedDataPath build/UISimulator CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='' ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" 2>&1 | tee build/logs/history-ui-build.log
      - name: Preserve compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-native-integration-${{ github.sha }}
          path: build/logs
          if-no-files-found: error

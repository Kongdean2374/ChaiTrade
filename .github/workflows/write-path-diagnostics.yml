name: Synthetic write path diagnosis (not acceptance)
on:
  push:
    branches: [write-path-diagnostics-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - run: bash scripts/preflight.sh
      - name: Diagnose all original 30 writes without changing the 150ms assertion
        run: |
          mkdir -p build/logs
          set -o pipefail
          CHAI_STRESS=1 CHAI_REPORT_DIR="$PWD/build/logs" swift test --package-path Packages/ChaiTradeCore -c release -Xswiftc -DCHAI_STORAGE_PROFILE --filter stressHistory100000 2>&1 | tee build/logs/stress-profile.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: write-path-profile
          path: build/logs/
          retention-days: 7
